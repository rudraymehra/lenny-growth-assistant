[project]
name = "lenny-growth-assistant-backend"
version = "1.0.0"
description = "The Lenny Growth Assistant — FastAPI backend, agent layer, and RAG pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "claude-agent-sdk>=0.1",
    "nh3>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
